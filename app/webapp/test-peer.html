<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dating Bot — Test Peer (LiveKit)</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.4/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    --bg: #0e1621; --text: #f5f7fa; --hint: #7d8b99; --accent: #e8823c; --card: rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .hint { color: var(--hint); text-align: center; max-width: 420px; line-height: 1.45; margin-bottom: 20px; }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: rgba(232,130,60,0.2); color: var(--accent); font-size: 12px; font-weight: 600; margin-bottom: 16px;
  }
  .stage {
    position: relative; width: 100%; max-width: 520px;
    background: #000; border-radius: 16px; overflow: hidden; min-height: 280px;
    display: flex; align-items: center; justify-content: center;
  }
  #remoteVideo { width: 100%; max-height: 60vh; display: none; background: #000; }
  #localVideo {
    position: absolute; top: 12px; right: 12px; width: 120px; border-radius: 10px;
    background: #111; display: none; border: 1px solid rgba(255,255,255,0.2);
  }
  .status { margin: 16px 0; color: var(--hint); font-size: 14px; }
  .controls { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    border: none; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    font-weight: 600; font-size: 14px; background: var(--card); color: var(--text);
  }
  button.primary { background: var(--accent); color: #fff; }
  button.danger { background: #e5484d; color: #fff; }
  button.active { outline: 2px solid var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #log {
    width: 100%; max-width: 520px; margin-top: 16px; max-height: 180px; overflow: auto;
    background: rgba(0,0,0,0.35); border-radius: 12px; padding: 10px;
    font-family: ui-monospace, monospace; font-size: 11px; color: var(--hint);
  }
</style>
</head>
<body>
  <div class="badge">DEV TEST PEER · LIVEKIT</div>
  <h1>Soxta suhbatdosh</h1>
  <p class="hint">
    Telefon Mini Appda Test match qiling, shu yerda <b>Start</b> bosing.
    LiveKit orqali ulanasiz (TURN bilan ovora bo‘lmaysiz).
  </p>
  <div class="stage">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <audio id="remoteAudio" autoplay></audio>
  </div>
  <div class="status" id="status">Token kutilmoqda...</div>
  <div class="controls">
    <button class="primary" id="startBtn">Start</button>
    <button id="muteBtn">Mute</button>
    <button id="videoBtn">Video</button>
    <button class="danger" id="endBtn">End</button>
  </div>
  <div id="log"></div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get("token") || "";
const partnerId = Number(params.get("partner_id") || 0);

let lkRoom = null;
let roomId = null;
let starting = false;
let isMuted = false;
let videoOn = false;

function dlog(msg) {
  const el = document.getElementById("log");
  const line = document.createElement("div");
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  console.log(msg);
}

function decodeToken(t) {
  const body = t.split(".")[0];
  const pad = "=".repeat((4 - (body.length % 4)) % 4);
  return JSON.parse(atob(body.replace(/-/g, "+").replace(/_/g, "/")));
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "ngrok-skip-browser-warning": "true",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Error ${res.status}`);
  }
  return res.json();
}

function attachRemote(track) {
  if (track.kind === "audio") {
    const el = track.attach();
    el.autoplay = true;
    document.getElementById("remoteAudio").replaceWith(el);
    el.id = "remoteAudio";
    el.play?.().catch(() => {});
    dlog("Remote audio");
  } else if (track.kind === "video") {
    const el = track.attach();
    el.autoplay = true;
    el.playsInline = true;
    el.style.cssText = "width:100%;max-height:60vh;display:block;background:#000;";
    document.getElementById("remoteVideo").replaceWith(el);
    el.id = "remoteVideo";
    dlog("Remote video");
  }
}

async function startCall() {
  if (starting) return;
  starting = true;
  document.getElementById("startBtn").disabled = true;

  if (!token) {
    document.getElementById("status").textContent = "URL da token yo'q";
    starting = false;
    document.getElementById("startBtn").disabled = false;
    return;
  }
  if (!window.LivekitClient) {
    document.getElementById("status").textContent = "LiveKit JS yuklanmadi";
    return;
  }

  try {
    roomId = decodeToken(token).room;
  } catch (e) {
    document.getElementById("status").textContent = "Token yaroqsiz";
    return;
  }

  dlog(`start room=${roomId}`);
  document.getElementById("status").textContent = "LiveKit token...";

  let join;
  try {
    join = await api(`/api/test/livekit-token?token=${encodeURIComponent(token)}`);
  } catch (e) {
    document.getElementById("status").textContent = e.message;
    dlog(e.message);
    starting = false;
    document.getElementById("startBtn").disabled = false;
    return;
  }

  const { Room, RoomEvent } = LivekitClient;
  lkRoom = new Room({ adaptiveStream: true, dynacast: true });
  lkRoom.on(RoomEvent.TrackSubscribed, (track) => {
    attachRemote(track);
    document.getElementById("status").textContent = "Ulandi";
  });
  lkRoom.on(RoomEvent.ParticipantConnected, (p) => {
    dlog("Peer: " + p.identity);
    document.getElementById("status").textContent = "Ulandi";
  });
  lkRoom.on(RoomEvent.Disconnected, () => {
    document.getElementById("status").textContent = "Uzildi";
    dlog("disconnected");
  });
  lkRoom.on(RoomEvent.ConnectionStateChanged, (s) => dlog("LK: " + s));

  try {
    dlog("Connect " + join.livekit_url);
    await lkRoom.connect(join.livekit_url, join.livekit_token);
    await lkRoom.localParticipant.setMicrophoneEnabled(true);
    document.getElementById("status").textContent =
      lkRoom.remoteParticipants.size > 0 ? "Ulandi" : "Ulandi — telefon kutilmoqda";
    dlog("OK participants=" + (1 + lkRoom.remoteParticipants.size));
  } catch (e) {
    dlog("Connect xato: " + e.message);
    document.getElementById("status").textContent = e.message;
    starting = false;
    document.getElementById("startBtn").disabled = false;
  }
}

async function cleanup(notify) {
  if (notify && roomId && partnerId && token) {
    api("/api/test/call/end", {
      method: "POST",
      body: JSON.stringify({ room_id: roomId, partner_id: partnerId, token }),
    }).catch(() => {});
  }
  if (lkRoom) {
    try { await lkRoom.disconnect(); } catch (_) {}
    lkRoom = null;
  }
  document.getElementById("status").textContent = "Tugadi";
  starting = false;
  document.getElementById("startBtn").disabled = false;
  dlog("cleanup");
}

document.getElementById("startBtn").onclick = () => startCall();
document.getElementById("endBtn").onclick = () => cleanup(true);

document.getElementById("muteBtn").onclick = async () => {
  if (!lkRoom) return;
  isMuted = !isMuted;
  await lkRoom.localParticipant.setMicrophoneEnabled(!isMuted);
  document.getElementById("muteBtn").classList.toggle("active", isMuted);
};

document.getElementById("videoBtn").onclick = async () => {
  if (!lkRoom) return;
  try {
    videoOn = !videoOn;
    await lkRoom.localParticipant.setCameraEnabled(videoOn);
    document.getElementById("videoBtn").classList.toggle("active", videoOn);
    const localVideo = document.getElementById("localVideo");
    if (videoOn) {
      const pub = lkRoom.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
      if (pub?.track) {
        const el = pub.track.attach();
        el.muted = true;
        el.autoplay = true;
        el.playsInline = true;
        el.id = "localVideo";
        el.style.cssText = "position:absolute;top:12px;right:12px;width:120px;border-radius:10px;display:block;";
        localVideo.replaceWith(el);
      }
    } else if (localVideo) {
      localVideo.style.display = "none";
    }
  } catch (e) {
    dlog("Kamera: " + e.message);
    videoOn = false;
  }
};

if (!token) {
  document.getElementById("status").textContent = "Token yo'q — Mini Appdan Test match bosing";
} else {
  try {
    document.getElementById("status").textContent = `Tayyor. Room: ${decodeToken(token).room}. Start bosing.`;
  } catch {
    document.getElementById("status").textContent = "Token o'qilmadi";
  }
}
</script>
</body>
</html>
