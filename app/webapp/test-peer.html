<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dating Bot — Test Peer</title>
<style>
  :root {
    --bg: #0e1621;
    --text: #f5f7fa;
    --hint: #7d8b99;
    --accent: #e8823c;
    --card: rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .hint { color: var(--hint); text-align: center; max-width: 420px; line-height: 1.45; margin-bottom: 20px; }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: rgba(232,130,60,0.2); color: var(--accent); font-size: 12px; font-weight: 600;
    margin-bottom: 16px;
  }
  .stage {
    position: relative; width: 100%; max-width: 520px;
    background: #000; border-radius: 16px; overflow: hidden; min-height: 320px;
    display: flex; align-items: center; justify-content: center;
  }
  #remoteVideo { width: 100%; max-height: 60vh; display: none; background: #000; }
  #localVideo {
    position: absolute; top: 12px; right: 12px; width: 120px; border-radius: 10px;
    background: #111; display: none; border: 1px solid rgba(255,255,255,0.2);
  }
  .status { margin: 16px 0; color: var(--hint); font-size: 14px; }
  .controls { display: flex; gap: 12px; margin-top: 8px; }
  button {
    border: none; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    font-weight: 600; font-size: 14px; background: var(--card); color: var(--text);
  }
  button.primary { background: var(--accent); color: #fff; }
  button.danger { background: #e5484d; color: #fff; }
  button.active { outline: 2px solid var(--accent); }
  #log {
    width: 100%; max-width: 520px; margin-top: 16px; max-height: 160px; overflow: auto;
    background: rgba(0,0,0,0.35); border-radius: 12px; padding: 10px;
    font-family: ui-monospace, monospace; font-size: 11px; color: var(--hint);
  }
</style>
</head>
<body>
  <div class="badge">DEV TEST PEER</div>
  <h1>Soxta suhbatdosh</h1>
  <p class="hint">
    Bu sahifa faqat <b>DEV_TEST_MODE</b> uchun. Telefoningizdagi Mini Appda qo‘ng‘iroq ochilgach,
    shu yerda Start bosing — audio/video ulanishi kerak.
  </p>

  <div class="stage">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <audio id="remoteAudio" autoplay></audio>
  </div>
  <div class="status" id="status">Token kutilmoqda...</div>
  <div class="controls">
    <button class="primary" id="startBtn">Start</button>
    <button id="muteBtn">Mute</button>
    <button id="videoBtn">Video</button>
    <button class="danger" id="endBtn">End</button>
  </div>
  <div id="log"></div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get("token") || "";
const TEST_PEER_ID = 999000001;

let roomId = null;
let partnerId = null; // real Telegram user — call/end da xabar beriladi
let pc = null;
let ws = null;
let localStream = null;
let videoTrack = null;
let videoOn = false;
let isMuted = false;
let makingOffer = false;
let ignoreOffer = false;
let polite = false;
let pendingIce = [];
let pendingLocalSdp = null;

function dlog(msg) {
  const el = document.getElementById("log");
  const line = document.createElement("div");
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  console.log(msg);
}

function decodeToken(t) {
  const body = t.split(".")[0];
  const pad = "=".repeat((4 - (body.length % 4)) % 4);
  const json = atob(body.replace(/-/g, "+").replace(/_/g, "/"));
  return JSON.parse(json);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "ngrok-skip-browser-warning": "true",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `Error ${res.status}`);
  }
  return res.json();
}

async function flushIce() {
  while (pendingIce.length && pc && pc.remoteDescription) {
    const c = pendingIce.shift();
    try { await pc.addIceCandidate(c); } catch (e) { dlog("ICE: " + e.message); }
  }
}

async function startCall() {
  if (!token) {
    document.getElementById("status").textContent = "URL da token yo'q";
    return;
  }
  let payload;
  try {
    payload = decodeToken(token);
  } catch (e) {
    document.getElementById("status").textContent = "Token yaroqsiz";
    return;
  }
  roomId = payload.room;
  // Real user ID token ichida yo'q — server CallSession da. Peer end qilganda
  // partner_id ni room dan bilmaymiz; Mini App o'zi ham tugatishi mumkin.
  // Token faqat peer uid + room. partner_id ni query dan olamiz yoki 0.
  partnerId = Number(params.get("partner_id") || 0);

  polite = TEST_PEER_ID > (partnerId || 0);
  document.getElementById("status").textContent = `Room: ${roomId}`;
  dlog(`start room=${roomId} polite=${polite}`);

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: false,
    });
    dlog("Mikrofon OK");
  } catch (e) {
    document.getElementById("status").textContent = "Mikrofon ruxsati kerak";
    dlog(e.message);
    return;
  }

  let iceServers = [{ urls: "stun:stun.l.google.com:19302" }];
  try {
    const turnData = await api(`/api/test/turn-credentials?token=${encodeURIComponent(token)}`);
    if (turnData.iceServers?.length) iceServers = turnData.iceServers;
  } catch (e) {
    dlog("TURN: " + e.message);
  }

  pc = new RTCPeerConnection({ iceServers, iceCandidatePoolSize: 4 });
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));

  pc.onicecandidate = (event) => {
    if (event.candidate && ws?.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "ice", candidate: event.candidate }));
    }
  };

  pc.ontrack = (event) => {
    dlog("Remote track: " + event.track.kind);
    const stream = event.streams[0] || new MediaStream([event.track]);
    if (event.track.kind === "audio") {
      const a = document.getElementById("remoteAudio");
      a.srcObject = stream;
      a.play().catch(() => {});
    }
    if (event.track.kind === "video") {
      const v = document.getElementById("remoteVideo");
      v.srcObject = stream;
      v.style.display = "block";
    }
  };

  pc.onnegotiationneeded = async () => {
    try {
      makingOffer = true;
      await pc.setLocalDescription();
      const payloadMsg = JSON.stringify({ type: "sdp", description: pc.localDescription });
      if (ws?.readyState === WebSocket.OPEN) {
        ws.send(payloadMsg);
        dlog("SDP yuborildi: " + pc.localDescription.type);
      } else {
        pendingLocalSdp = payloadMsg;
      }
    } catch (e) {
      dlog("nego: " + e.message);
    } finally {
      makingOffer = false;
    }
  };

  pc.oniceconnectionstatechange = () => {
    dlog("ICE: " + pc.iceConnectionState);
    document.getElementById("status").textContent = "ICE: " + pc.iceConnectionState;
  };

  const wsProto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${wsProto}://${location.host}/ws/call/${roomId}?test_token=${encodeURIComponent(token)}`);
  ws.onopen = () => {
    dlog("WS ochildi");
    if (pendingLocalSdp) {
      ws.send(pendingLocalSdp);
      pendingLocalSdp = null;
    }
  };
  ws.onclose = (e) => dlog(`WS yopildi ${e.code}`);
  ws.onerror = () => dlog("WS xato");

  ws.onmessage = async (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    if (msg.type === "peer-joined") {
      dlog("Peer qo'shildi peers=" + msg.peers);
      document.getElementById("status").textContent = "Peer bor — ulanmoqda...";
      if (pc && !pc.remoteDescription && !makingOffer) {
        try {
          makingOffer = true;
          await pc.setLocalDescription();
          ws.send(JSON.stringify({ type: "sdp", description: pc.localDescription }));
          dlog("peer-joined: offer yuborildi");
        } catch (e) {
          dlog("offer xato: " + e.message);
        } finally {
          makingOffer = false;
        }
      }
      return;
    }
    if (msg.type === "peer-left") {
      dlog("Peer chiqdi");
      document.getElementById("status").textContent = "Hamroh chiqdi";
      return;
    }
    if (msg.type === "offer" || msg.type === "answer") {
      msg = { type: "sdp", description: msg.sdp };
    }
    if (msg.type === "sdp" && msg.description) {
      const desc = msg.description;
      const offerCollision = desc.type === "offer" && (makingOffer || pc.signalingState !== "stable");
      ignoreOffer = !polite && offerCollision;
      if (ignoreOffer) { dlog("collision ignore"); return; }
      try {
        await pc.setRemoteDescription(desc);
        await flushIce();
        if (desc.type === "offer") {
          await pc.setLocalDescription();
          ws.send(JSON.stringify({ type: "sdp", description: pc.localDescription }));
          dlog("Answer yuborildi");
        }
      } catch (e) { dlog("SDP: " + e.message); }
    } else if (msg.type === "ice" && msg.candidate) {
      if (!pc.remoteDescription) pendingIce.push(msg.candidate);
      else {
        try { await pc.addIceCandidate(msg.candidate); } catch (e) { dlog(e.message); }
      }
    }
  };
}

function cleanup(notify) {
  if (notify && roomId && partnerId) {
    api("/api/test/call/end", {
      method: "POST",
      body: JSON.stringify({ room_id: roomId, partner_id: partnerId, token }),
    }).catch(() => {});
  }
  if (videoTrack) { try { videoTrack.stop(); } catch (_) {} videoTrack = null; }
  if (pc) { pc.close(); pc = null; }
  if (ws) { ws.close(); ws = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  document.getElementById("status").textContent = "Tugadi";
  dlog("cleanup");
}

document.getElementById("startBtn").onclick = () => startCall();
document.getElementById("endBtn").onclick = () => cleanup(true);

document.getElementById("muteBtn").onclick = () => {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach((t) => (t.enabled = !isMuted));
  document.getElementById("muteBtn").classList.toggle("active", isMuted);
};

document.getElementById("videoBtn").onclick = async () => {
  if (!pc || !localStream) return;
  const btn = document.getElementById("videoBtn");
  const localVideo = document.getElementById("localVideo");
  if (!videoOn) {
    try {
      const vs = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      });
      videoTrack = vs.getVideoTracks()[0];
      localStream.addTrack(videoTrack);
      pc.addTrack(videoTrack, localStream);
      localVideo.srcObject = new MediaStream([videoTrack]);
      localVideo.style.display = "block";
      videoOn = true;
      btn.classList.add("active");
    } catch (e) {
      dlog("Kamera: " + e.message);
    }
  } else {
    const sender = pc.getSenders().find((s) => s.track && s.track.kind === "video");
    if (sender) try { pc.removeTrack(sender); } catch (_) {}
    if (videoTrack) {
      videoTrack.stop();
      localStream.removeTrack(videoTrack);
      videoTrack = null;
    }
    localVideo.srcObject = null;
    localVideo.style.display = "none";
    videoOn = false;
    btn.classList.remove("active");
  }
};

if (!token) {
  document.getElementById("status").textContent = "Token yo'q — Mini Appdan Test match bosing";
} else {
  try {
    const p = decodeToken(token);
    document.getElementById("status").textContent = `Tayyor. Room: ${p.room}. Start bosing.`;
  } catch {
    document.getElementById("status").textContent = "Token o'qilmadi";
  }
}
</script>
</body>
</html>
