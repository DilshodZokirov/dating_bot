services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    # Build muvaffaqiyatsiz bo'lsa: eski image + livekit-api ni startida o'rnatadi
    command: >
      sh -c "python -c 'import livekit.api' 2>/dev/null || pip install --no-cache-dir 'livekit-api==1.2.0';
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python -c 'import livekit.api' 2>/dev/null || pip install --no-cache-dir 'livekit-api==1.2.0';
             python -m app.bot.bot"
    env_file: .env
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >
      -n --log-file=stdout
      --realm=dating.local
      --user=dating:datingturn
      --lt-cred-mech
      --fingerprint
      --no-cli
    profiles: ["turn"]

volumes:
  pgdata:
